# OpenTelemetry collector for the local stack, per README.md section 11.
#
# A33 emits one span per event and one child span per agent hop. Until then this collector
# accepts and logs spans, which is enough to prove the pipe works end to end.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
  # Bounded so the collector cannot become the component that exhausts the memory budget.
  memory_limiter:
    check_interval: 1s
    limit_mib: 160
    spike_limit_mib: 40

exporters:
  debug:
    verbosity: normal

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
  telemetry:
    logs:
      level: info
