  - id: loghub-bgl
    origin: https://raw.githubusercontent.com/logpai/loghub/master/BGL/BGL_2k.log
    upstream: https://github.com/logpai/loghub
    license: LogHub dataset license, free for research or academic work
    license_url: https://github.com/logpai/loghub/blob/master/LICENSE
    redistributable: true
    redistribution_conditions: >-
      Attribution to the loghub repository URL, citation of the loghub paper, and inclusion
      of the license notice in all copies.
    retrieved: 2026-08-08
    records: 2000
    sha256: "2a819ea540909db682005c9cf948387a40729b5c2e9f19d430e29ce704825496"
    redactions: none
    kind: hardware_alert
    service: bluegene
    note: >-
      Blue Gene/L supercomputer logs, already labeled upstream as alert or non-alert. Chosen
      for hardware failures and because the upstream alert flag is a useful sanity check on
      severity labeling, though it is never used as a gold label.

# Size of the committed demo slice per source. Kept small so the repository stays reviewable
# while docker compose up plus make eval works from a clean checkout.
demo_slice_records: 120
