# Pinned event sources. Every field here is recorded in docs/sources.md in prose as well;
# this file is what scripts/fetch_sources.py reads and what the tests assert against, so the
# two cannot drift.
#
# sha256 pins the exact snapshot. A source changing under us is a loud failure rather than a
# silent change in the labeled set, which would invalidate every comparison made against it.
#
# sha256 values are quoted deliberately: an unquoted all-digit hash is parsed by YAML as an
# integer and would then never compare equal to the hex string computed at runtime.

version: 1

citation: >-
  Jieming Zhu, Shilin He, Pinjia He, Jinyang Liu, Michael R. Lyu. Loghub: A Large Collection
  of System Log Datasets for AI-driven Log Analytics. In ISSRE, 2023.

sources:
  - id: loghub-hdfs
