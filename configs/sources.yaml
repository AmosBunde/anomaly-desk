    upstream: https://github.com/logpai/loghub
    license: LogHub dataset license, free for research or academic work
    license_url: https://github.com/logpai/loghub/blob/master/LICENSE
    redistributable: true
    redistribution_conditions: >-
      Attribution to the loghub repository URL, citation of the loghub paper, and inclusion
      of the license notice in all copies.
    retrieved: 2026-08-08
    records: 2000
    sha256: "025a1bc64ff5b2ef4a4bda6c4ad5c5c5f18478b71cd1ad2b0676e01625629f2f"
    redactions: none
    kind: api_log
    service: nova
    note: >-
      OpenStack Nova compute logs. Instance lifecycle and API request events. Chosen for
